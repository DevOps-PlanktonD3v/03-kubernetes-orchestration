# ============================================================
# docker/apache.conf - Konfigurasi Virtual Host Apache
#
# File ini menggantikan konfigurasi default Apache di container.
# Perubahan utama: DocumentRoot diarahkan ke /var/www/html/public
# karena folder public/ adalah entry point aplikasi Laravel.
#
# Apache akan meng-copy file ini ke:
# /etc/apache2/sites-available/000-default.conf
# ============================================================

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    # Wajib ada agar Apache tidak print warning "Could not determine FQDN"
    ServerName localhost

    # Arahkan ke folder public Laravel, bukan root project
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Izinkan .htaccess untuk override konfigurasi
        # (diperlukan agar Laravel routing bisa bekerja)
        AllowOverride All

        # Izinkan semua akses
        Require all granted

        # Aktifkan symlinks (untuk storage link)
        Options FollowSymLinks
    </Directory>

    # Log ke stdout/stderr container agar bisa dibaca dengan: kubectl logs <pod>
    # /proc/self/fd/2 = stderr, /proc/self/fd/1 = stdout
    # Lebih reliable daripada /dev/stderr karena bisa ditulis oleh www-data
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
