apiVersion: apps/v1
kind: Deployment

metadata:
  # Nama Deployment
  name: laravel-web
spec:
  # Jumlah replica
  replicas: 2
  selector:
    matchLabels:
      # Label workload
      app: laravel-web
  template:
    metadata:
      labels:
        # Label Pod
        app: laravel-web
    spec:
      containers:
      - name: laravel
        # Laravel Demo Application
        image: serversideup/php:8.3-fpm-nginx
        ports:
        # NGINX HTTP Port
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"