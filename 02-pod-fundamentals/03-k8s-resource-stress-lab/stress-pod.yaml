apiVersion: v1
kind: Pod

metadata:
  name: stress-pod

spec:
  containers:
  - name: stress-container
    image: polinux/stress

    command:
    - stress

    args:
    - "--cpu"
    - "1"
    - "--vm"
    - "1"
    - "--vm-bytes"
    - "200M"
    - "--timeout"
    - "300s"

    resources:
      requests:
        cpu: "200m"
        memory: "128Mi"

      limits:
        cpu: "500m"
        memory: "256Mi"