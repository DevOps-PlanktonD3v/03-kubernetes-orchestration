apiVersion: v1
kind: Pod

metadata:
  name: sidecar-demo

spec:

  volumes:
  - name: shared-logs
    emptyDir: {}

  containers:

  - name: nginx
    image: nginx

    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/nginx

  - name: log-sidecar
    image: busybox

    command:
    - sh
    - -c
    - |
      tail -F /logs/access.log

    volumeMounts:
    - name: shared-logs
      mountPath: /logs