apiVersion: v1
kind: Pod

metadata:
  name: multi-container-pod

spec:

  volumes:
  - name: shared-data
    emptyDir: {}

  initContainers:
  - name: init-container
    image: busybox

    command:
    - sh
    - -c
    - |
      echo "Initialization completed" > /data/index.html

    volumeMounts:
    - name: shared-data
      mountPath: /data

  containers:

  - name: nginx
    image: nginx

    volumeMounts:
    - name: shared-data
      mountPath: /usr/share/nginx/html

  - name: helper-container
    image: busybox

    command:
    - sh
    - -c
    - |
      while true;
      do
        cat /shared/index.html;
        sleep 10;
      done

    volumeMounts:
    - name: shared-data
      mountPath: /shared